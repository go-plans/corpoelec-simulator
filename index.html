<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#071222">
<title>Corpoelec Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #071222;
    --card: #0d1f3c;
    --gold: #ffd400;
    --blue: #1e90ff;
    --text: #e8eef7;
    --dim: #8ea3c4;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #123055 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.4;
  }

  .hidden { display: none !important; }

  /* ============ Pantalla de ingreso ============ */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(900px 500px at 50% -10%, #123055 0%, var(--bg) 60%);
  }

  .entry-card {
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border: 1px solid #1d3a63;
    border-radius: 18px;
    padding: 22px 20px 24px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    animation: rise .45s ease;
  }

  .entry-card .banner {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 14px;
    display: block;
  }

  .entry-card h1 {
    font-size: 22px;
    letter-spacing: 1.5px;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .entry-card p.question {
    color: var(--dim);
    font-size: 14px;
    margin: 10px 0 12px;
  }

  .entry-card input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #24467a;
    background: #091a31;
    color: var(--text);
    outline: none;
    text-align: center;
  }

  .entry-card input:focus { border-color: var(--blue); }
  .entry-card input::placeholder { color: #4c6185; }

  .entry-card button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffd400, #f0b400);
    color: #231900;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 212, 0, 0.35);
  }
  .entry-card button:active { transform: scale(0.97); }

  /* ============ App ============ */
  #app { max-width: 480px; margin: 0 auto; padding: 14px 14px 40px; }

  header { text-align: center; margin-bottom: 14px; }
  header .banner {
    width: 100%;
    border-radius: 14px;
    display: block;
    box-shadow: 0 4px 22px rgba(0, 0, 0, 0.4);
  }
  header h1 {
    margin-top: 12px;
    font-size: clamp(20px, 6vw, 26px);
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 2px 14px rgba(255, 212, 0, 0.35);
  }

  main { text-align: center; }

  .scene {
    position: relative;
    width: min(88vw, 420px);
    margin: 0 auto 26px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #1d3a63;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
    background: #03060c;
  }
  .scene img { width: 100%; display: block; }

  /* brillo cuando hay luz */
  #mapGlow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(70% 55% at 50% 45%, rgba(255, 214, 90, 0.55) 0%, rgba(255, 200, 60, 0.18) 45%, transparent 75%);
    opacity: 0;
    transition: opacity .35s ease;
  }
  #app.lit #mapGlow { opacity: 1; }

  /* destello de apagón */
  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 40;
    transition: opacity .12s ease;
  }
  body.blacking #blackout { opacity: .85; }

  /* ============ Breaker ============ */
  .breaker-btn {
    width: min(46vw, 210px);
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1c3a66, #0a1b33 70%);
    border: 2px solid #2c538f;
    padding: 8px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    touch-action: manipulation;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .breaker-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .breaker-btn:active { transform: scale(0.93); }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    background: #10263f;
    border: 1px solid #25467528;
    transition: background .3s, color .3s, border-color .3s;
  }
  .status.on  { color: #ffe66a; border-color: rgba(255, 212, 0, .45); }
  .status.off { color: #9fb2d1; border-color: rgba(255, 255, 255, .12); }

  .counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
  }
  .counter-label { color: var(--dim); font-size: 15px; }
  .counter-value {
    font-size: 34px;
    font-weight: 800;
    color: var(--gold);
    min-width: 60px;
    text-shadow: 0 0 18px rgba(255, 212, 0, .35);
  }
  .counter-value.pop { animation: pop .35s ease; }

  /* ============ Ranking ============ */
  .ranking {
    margin-top: 34px;
    background: var(--card);
    border: 1px solid #1d3a63;
    border-radius: 16px;
    padding: 18px 14px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.4);
  }
  .ranking h2 {
    text-align: center;
    font-size: 19px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .record {
    text-align: center;
    font-size: 14px;
    color: #ffe66a;
    background: rgba(255, 212, 0, 0.08);
    border: 1px dashed rgba(255, 212, 0, .4);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 14px;
  }
  .empty { text-align: center; color: var(--dim); font-size: 14px; padding: 14px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead th {
    background: rgba(255, 212, 0, 0.14);
    color: var(--gold);
    padding: 10px 6px;
    font-size: 13px;
    letter-spacing: 1px;
    border-bottom: 2px solid rgba(255, 212, 0, .35);
  }
  tbody td {
    padding: 11px 6px;
    text-align: center;
    border-bottom: 1px solid #16294a;
  }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
  tbody tr.me { background: rgba(255, 212, 0, 0.12); font-weight: 700; color: #ffe66a; }
  tbody tr.me td:first-child { border-left: 4px solid var(--gold); }
  .rank-num { color: var(--dim); }
  .rank-high { color: var(--gold); font-weight: 800; }

  /* ============ Animaciones ============ */
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.45); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<!-- Pantalla de ingreso -->
<div id="entryOverlay" class="overlay">
  <div class="entry-card">
    <img class="banner" src="img/5.png" alt="Corpoelec">
    <h1>CORPOELEC SIMULATOR</h1>
    <p class="question">¿Cómo te llamas, jefe de sala?</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="Tu nombre" autocomplete="off">
    <button id="enterBtn">ENTRAR AL SIMULADOR</button>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <img class="banner" src="img/5.png" alt="Corpoelec">
    <h1>CORPOELEC SIMULATOR</h1>
  </header>

  <main id="mainArea">
    <div class="scene">
      <img id="mapImg" src="img/Mapa con luz.png" alt="Mapa">
      <div id="mapGlow"></div>
    </div>

    <button id="breakerBtn" class="breaker-btn" aria-label="Interruptor">
      <img id="breakerImg" src="img/Breaker arriba.png" alt="Interruptor">
    </button>

    <p id="status" class="status on">⚡ Luz encendida</p>

    <div class="counter">
      <span class="counter-label">🔌 Apagones causados</span>
      <span id="counterValue" class="counter-value">0</span>
    </div>
  </main>

  <section class="ranking">
    <h2>🏆 RANKING</h2>
    <div id="record" class="record"></div>
    <p id="emptyRank" class="empty">Aún no hay apagones registrados. ¡Sé el primero!</p>
    <table id="rankTable" class="hidden">
      <thead>
        <tr><th>#</th><th>Jugador</th><th>Apagones</th></tr>
      </thead>
      <tbody id="rankBody"></tbody>
    </table>
  </section>
</div>

<div id="blackout"></div>

<script>
(function () {
  'use strict';

  var SCORES_KEY = 'corpoelec_scores_v1';
  var NAME_KEY   = 'corpoelec_lastName_v1';

  var player = null;   // { name, score }
  var powerOn = true;

  var $ = function (id) { return document.getElementById(id); };

  var entryOverlay = $('entryOverlay'), app = $('app'), nameInput = $('nameInput');
  var enterBtn = $('enterBtn'), mapImg = $('mapImg'), breakerImg = $('breakerImg');
  var statusEl = $('status'), counterValue = $('counterValue'), mainArea = $('mainArea');
  var rankBody = $('rankBody'), rankTable = $('rankTable'), emptyRank = $('emptyRank');
  var recordEl = $('record');

  /* ---------- persistencia ---------- */
  function loadScores() {
    try {
      var raw = localStorage.getItem(SCORES_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (s) { return s && s.name; }) : [];
    } catch (e) { return []; }
  }
  function saveScores(scores) {
    try { localStorage.setItem(SCORES_KEY, JSON.stringify(scores)); } catch (e) {}
  }
  function upsertScore(name, score) {
    var scores = loadScores();
    var found = false;
    for (var i = 0; i < scores.length; i++) {
      if (scores[i].name.toLowerCase() === name.toLowerCase()) {
        scores[i].score = score;
        found = true;
        break;
      }
    }
    if (!found) scores.push({ name: name, score: score });
    scores.sort(function (a, b) { return b.score - a.score; });
    saveScores(scores);
    return scores;
  }

  /* ---------- sonido (Web Audio) ---------- */
  var audioCtx = null;
  function playClick() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var ctx = audioCtx, t = ctx.currentTime;

      // "tic" agudo: ráfaga de ruido filtrada
      var dur = 0.04, rate = ctx.sampleRate, n = Math.floor(rate * dur);
      var buf = ctx.createBuffer(1, n, rate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < n; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
      }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.4;
      var g1 = ctx.createGain(); g1.gain.value = 0.5;
      src.connect(bp); bp.connect(g1); g1.connect(ctx.destination);
      src.start(t);

      // "clac" grave del mecanismo
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.06);
      var g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.35, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      o.connect(g2); g2.connect(ctx.destination);
      o.start(t); o.stop(t + 0.08);
    } catch (e) { /* el sonido nunca debe romper la app */ }
  }

  /* ---------- ranking UI ---------- */
  function renderRanking() {
    var scores = loadScores();
    emptyRank.classList.toggle('hidden', scores.length > 0);
    rankTable.classList.toggle('hidden', scores.length === 0);
    rankBody.innerHTML = '';
    if (scores.length === 0) {
      recordEl.textContent = '';
      recordEl.classList.add('hidden');
      return;
    }
    var best = scores[0];
    recordEl.textContent = '🏆 Récord: ' + best.name + ' con ' + best.score + (best.score === 1 ? ' apagón' : ' apagones');
    recordEl.classList.remove('hidden');

    scores.forEach(function (s, idx) {
      var tr = document.createElement('tr');
      if (player && s.name.toLowerCase() === player.name.toLowerCase()) tr.className = 'me';

      var tdPos = document.createElement('td');
      tdPos.className = idx < 3 ? 'rank-high' : 'rank-num';
      tdPos.textContent = (idx < 3 ? ['🥇', '🥈', '🥉'][idx] : (idx + 1)) + (idx >= 3 ? '' : '');

      var tdName = document.createElement('td');
      tdName.textContent = s.name;

      var tdScore = document.createElement('td');
      tdScore.textContent = s.score;

      tr.appendChild(tdPos); tr.appendChild(tdName); tr.appendChild(tdScore);
      rankBody.appendChild(tr);
    });
  }

  /* ---------- interruptor ---------- */
  function toggleBreaker() {
    powerOn = !powerOn;
    playClick();

    mapImg.src = powerOn ? 'img/Mapa con luz.png' : 'img/Mapa sin luz.png';
    breakerImg.src = powerOn ? 'img/Breaker arriba.png' : 'img/Breaker abajo.png';
    mainArea.classList.toggle('lit', powerOn);
    statusEl.textContent = powerOn ? '⚡ Luz encendida' : '🔌 Apagón';
    statusEl.className = 'status ' + (powerOn ? 'on' : 'off');

    if (!powerOn) {
      // destello de apagón
      document.body.classList.add('blacking');
      setTimeout(function () { document.body.classList.remove('blacking'); }, 160);

      if (player) {
        player.score += 1;
        counterValue.textContent = player.score;
        counterValue.classList.remove('pop');
        void counterValue.offsetWidth; // reinicia la animación
        counterValue.classList.add('pop');
        upsertScore(player.name, player.score);
        renderRanking();
      }
    }
  }

  /* ---------- ingreso ---------- */
  function enter() {
    var name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    name = name.slice(0, 20);

    var scores = loadScores();
    for (var i = 0; i < scores.length; i++) {
      if (scores[i].name.toLowerCase() === name.toLowerCase()) {
        player = { name: scores[i].name, score: scores[i].score };
        player = { name: name, score: scores[i].score };
        break;
      }
    }
    if (!player) player = { name: name, score: 0 };

    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}

    counterValue.textContent = player.score;
    entryOverlay.classList.add('hidden');
    app.classList.remove('hidden');
    renderRanking();
  }

  /* ---------- eventos ---------- */
  enterBtn.addEventListener('click', enter);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') enter();
  });
  $('breakerBtn').addEventListener('click', toggleBreaker);

  /* nombre memorizado */
  try {
    var last = localStorage.getItem(NAME_KEY);
    if (last) nameInput.value = last;
  } catch (e) {}
  renderRanking();
  nameInput.focus();
})();
</script>
</body>
</html>
